name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: npm run build (vue-tsc + vite)
        working-directory: frontend
        run: npm run build

      - name: npm run lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: npm run format:check (Prettier)
        working-directory: frontend
        run: npm run format:check

      # frontend/dist is //go:embed'ed by main.go, so the frontend must be
      # built before any Go step.

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          # Uses .golangci.yml from the repo root; no build tags needed.

      - name: go test
        run: go test ./... -count=1
